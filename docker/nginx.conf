worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  # Writable paths for the unprivileged runtime user.
  client_body_temp_path /var/lib/nginx/tmp/client_body;
  proxy_temp_path /var/lib/nginx/tmp/proxy;
  fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
  uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
  scgi_temp_path /var/lib/nginx/tmp/scgi;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed asset filenames make these safe to cache forever.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # The service worker must never be served stale, or clients pin an old build.
    location = /sw.js {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # Single-page app: unknown paths fall through to the shell.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
